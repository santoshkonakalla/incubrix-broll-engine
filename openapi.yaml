openapi: 3.1.0
info:
  title: IncuBrix Script & Voiceover to B-roll Video Engine
  description: Production-ready containerized API service that turns voiceovers, scripts,
    or IncuBrix scene lists into licence-clean, caption-synced B-roll videos across
    16:9, 9:16, and 1:1 aspect ratios.
  version: 1.0.0
paths:
  /api/v1/broll/jobs:
    post:
      tags:
      - B-roll Engine v1
      summary: Submit a B-roll generation job from audio_url, plain script, or IncuBrix
        scenes
      operationId: create_broll_job_api_v1_broll_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBrollJobRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad Request
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unprocessable Entity
  /api/v1/broll/jobs/upload:
    post:
      tags:
      - B-roll Engine v1
      summary: Submit a B-roll generation job with a direct audio file upload (mp3,
        wav, m4a)
      operationId: create_broll_job_upload_api_v1_broll_jobs_upload_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_broll_job_upload_api_v1_broll_jobs_upload_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Bad Request
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported Media Type
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - B-roll Engine v1
      summary: Poll background job status, progress (0-100), warnings, and artifact
        download links
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}/cancel:
    post:
      tags:
      - B-roll Engine v1
      summary: Cancel a queued or running job and clear worker queue
      operationId: cancel_job_api_v1_jobs__job_id__cancel_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/broll/jobs/{job_id}/scenes/{scene_index}/swap:
    post:
      tags:
      - B-roll Engine v1
      summary: Replace a single scene's clip and fast re-render only the affected
        segment
      operationId: swap_scene_clip_api_v1_broll_jobs__job_id__scenes__scene_index__swap_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      - name: scene_index
        in: path
        required: true
        schema:
          type: integer
          title: Scene Index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwapSceneClipRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Swap Scene Clip Api V1 Broll Jobs  Job Id  Scenes  Scene
                  Index  Swap Post
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Not Found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Conflict
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/files/{object_key}:
    get:
      tags:
      - B-roll Engine v1
      summary: Download a generated artifact (MP4, SRT, timeline.json, manifest.json)
        from object storage
      operationId: download_artifact_api_v1_files__object_key__get
      parameters:
      - name: object_key
        in: path
        required: true
        schema:
          type: string
          title: Object Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - Observability
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /ready:
    get:
      tags:
      - Observability
      summary: Ready
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
components:
  schemas:
    Body_create_broll_job_upload_api_v1_broll_jobs_upload_post:
      properties:
        audio_file:
          type: string
          contentMediaType: application/octet-stream
          title: Audio File
          description: Voiceover audio file (mp3, wav, or m4a, up to 10 min).
        metadata:
          type: string
          title: Metadata
          description: JSON string matching CreateBrollJobRequest options (aspect_ratios,
            style, avoid, captions, callback_url).
          default: '{"aspect_ratios": ["16:9", "9:16"]}'
      type: object
      required:
      - audio_file
      title: Body_create_broll_job_upload_api_v1_broll_jobs_upload_post
    CaptionsConfig:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          description: Burn captions directly into rendered MP4.
          default: true
        srt:
          type: boolean
          title: Srt
          description: Generate downloadable captions.srt file.
          default: true
      type: object
      title: CaptionsConfig
    CreateBrollJobRequest:
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
          description: HTTP(S) URL to voiceover audio (mp3, wav, m4a, up to 10 min).
        script:
          anyOf:
          - type: string
          - type: 'null'
          title: Script
          description: Plain-text narration script (synthesized via TTS).
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneHintInput'
            type: array
          - type: 'null'
          title: Scenes
          description: Optional IncuBrix scene list with text + visual_hint.
        voice:
          type: string
          title: Voice
          description: Voice identifier used when input is script/scenes (e.g. en-IN-female,
            hi-IN-female, ta-IN-female).
          default: en-IN-female
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
          description: Optional ISO language hint (en, hi, ta). Auto-detected from
            voice/audio if omitted.
        aspect_ratios:
          items:
            type: string
            enum:
            - '16:9'
            - '9:16'
            - '1:1'
          type: array
          minItems: 1
          title: Aspect Ratios
          description: Target output aspect ratios (any combination of 16:9, 9:16,
            1:1).
        style:
          type: string
          title: Style
          description: Visual style guidance for B-roll selection and generation.
          default: bright, modern, real-world footage
        avoid:
          items:
            type: string
          type: array
          title: Avoid
          description: Optional content/concepts to avoid (e.g., people's faces, alcohol).
        captions:
          $ref: '#/components/schemas/CaptionsConfig'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
          description: Optional webhook URL invoked on completion with HMAC-SHA256
            X-IncuBrix-Signature.
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Optional deterministic seed recorded in manifest.json.
        disabled_sources:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Disabled Sources
          description: Optional per-job footage sources to disable (useful for resilience/failover
            testing).
      type: object
      title: CreateBrollJobRequest
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          additionalProperties: true
          type: object
          title: Details
      type: object
      required:
      - code
      - message
      - retryable
      title: ErrorBody
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorEnvelope
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          const: ok
          title: Status
        version:
          type: string
          title: Version
      type: object
      required:
      - status
      - version
      title: HealthResponse
    JobAcceptedResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
        status_url:
          type: string
          title: Status Url
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
          default: false
      type: object
      required:
      - job_id
      - status
      - progress
      - status_url
      title: JobAcceptedResponse
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          title: Status
        progress:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Progress
        stage:
          type: string
          title: Stage
          default: queued
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        result:
          anyOf:
          - $ref: '#/components/schemas/ResultLinks'
          - type: 'null'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        metrics:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metrics
      type: object
      required:
      - job_id
      - status
      - progress
      - created_at
      - updated_at
      title: JobStatusResponse
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - degraded
          title: Status
        checks:
          additionalProperties:
            type: boolean
          type: object
          title: Checks
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
    ResultLinks:
      properties:
        videos:
          additionalProperties:
            type: string
          type: object
          title: Videos
          description: Map of aspect ratio -> download URL.
        captions_srt:
          anyOf:
          - type: string
          - type: 'null'
          title: Captions Srt
        timeline_json:
          anyOf:
          - type: string
          - type: 'null'
          title: Timeline Json
        manifest_json:
          anyOf:
          - type: string
          - type: 'null'
          title: Manifest Json
      type: object
      title: ResultLinks
    SceneHintInput:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Narration text for this scene.
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
          description: Optional visual direction from IncuBrix.
      type: object
      required:
      - text
      title: SceneHintInput
    SwapSceneClipRequest:
      properties:
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
          description: New search/generation query for replacement clip.
        preferred_source:
          anyOf:
          - type: string
          - type: 'null'
          title: Preferred Source
          description: Optional preferred footage source (pexels, pixabay, generative,
            statcard).
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
          description: Optional explicit visual direction.
        clip_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Clip Url
          description: Optional direct licensed clip URL to use.
        licence:
          anyOf:
          - type: string
          - type: 'null'
          title: Licence
          description: Licence string when clip_url is directly supplied.
          default: User-supplied Commercial Licence
        attribution:
          anyOf:
          - type: string
          - type: 'null'
          title: Attribution
          description: Attribution string when clip_url is directly supplied.
          default: User-supplied clip
      type: object
      title: SwapSceneClipRequest
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
